name: Release

on:
  push:
    tags:
      - 'v*'
      - 'dev-latest'
  workflow_dispatch:

concurrency:
  group: gcal-ctrl-release
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --name GCalCtrlCli --console gcal_ctrl/cli.py

      - name: Check manifest version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $manifest = Get-Content plugin.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $expected = "v$($manifest.version)"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match plugin.json version $($manifest.version)"
          }

      - name: Archive plugin
        run: |
          Compress-Archive -Path dist\GCalCtrlCli.exe, plugin.json -DestinationPath GCalCtrl.zip

      - name: Upload Release Asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:GITHUB_REF_NAME -like 'v*') {
            $tag = $env:GITHUB_REF_NAME
            gh release view $tag --repo "${{ github.repository }}" *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag GCalCtrl.zip --repo "${{ github.repository }}" --clobber
            } else {
              gh release create $tag GCalCtrl.zip `
                --repo "${{ github.repository }}" `
                --title $tag
            }
          } else {
            gh release view dev-latest --repo "${{ github.repository }}" *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release upload dev-latest GCalCtrl.zip --repo "${{ github.repository }}" --clobber
            } else {
              gh release create dev-latest GCalCtrl.zip `
                --repo "${{ github.repository }}" `
                --title "Dev Build (Latest)" `
                --prerelease
            }
          }
