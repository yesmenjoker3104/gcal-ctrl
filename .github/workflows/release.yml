name: Release

on:
  push:
    tags:
      - 'v*'
      - 'dev-latest'
  workflow_dispatch:

concurrency:
  group: gcal-ctrl-release
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --name GCalCtrlCli --console gcal_ctrl/cli.py

      - name: Archive
        run: |
          Compress-Archive -Path dist\GCalCtrlCli.exe -DestinationPath GCalCtrlCli-Windows.zip

      - name: Upload Release Asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view dev-latest --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload dev-latest GCalCtrlCli-Windows.zip --repo "${{ github.repository }}" --clobber
          } else {
            gh release create dev-latest GCalCtrlCli-Windows.zip `
              --repo "${{ github.repository }}" `
              --title "Dev Build (Latest)" `
              --prerelease
          }
